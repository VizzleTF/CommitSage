name: Create Release and Publish to Marketplaces

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      notes: ${{ steps.release_notes.outputs.NOTES }}
      telegram_msg: ${{ steps.release_notes.outputs.TELEGRAM_MSG }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set API Key
        run: |
          mkdir -p src/constants
          echo "export const AMPLITUDE_API_KEY = '${{ secrets.AMPLITUDE_API_KEY }}';" > src/constants/apiKeys.ts

      - name: Package Extension
        # `vsce package` runs `vscode:prepublish` (esbuild production)
        # automatically — no separate build step needed.
        run: npm run package

      - name: Get version from package.json
        id: get_version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Generate Release Notes
        id: release_notes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bash .github/scripts/generate-release-notes.sh

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: '*.vsix'
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix

      - name: Create Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_NOTES: ${{ needs.build.outputs.notes }}
        with:
          script: |
            const fs = require('fs');
            const { repo: { owner, repo } } = context;
            const tag = context.ref.substring(10);
            const version = process.env.VERSION;
            const releaseNotes = process.env.RELEASE_NOTES;

            const release = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: `Release ${tag}`,
              body: releaseNotes,
              draft: false,
              prerelease: false
            });

            const vsixFile = `geminicommit-${version}.vsix`;
            if (fs.existsSync(vsixFile)) {
              const asset = await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.data.id,
                name: vsixFile,
                data: fs.readFileSync(vsixFile)
              });
              console.log(`Asset uploaded: ${asset.data.browser_download_url}`);
            } else {
              core.setFailed(`VSIX file not found: ${vsixFile}`);
            }

  # The publish jobs run vsce and ovsx from package-lock.json: `npx --no`
  # fails instead of downloading whatever version npm has at that moment.
  # Both CLIs read the token from the environment, so it never appears in
  # the command line.
  publish-vscode:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: marketplace
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download VSIX artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VS_MARKETPLACE_TOKEN }}
        run: npx --no vsce publish --packagePath "geminicommit-${{ needs.build.outputs.version }}.vsix"

  publish-openvsx:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: marketplace
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download VSIX artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix

      - name: Publish to Open VSX Registry
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
        run: npx --no ovsx publish "geminicommit-${{ needs.build.outputs.version }}.vsix"

  notify:
    needs: [build, release, publish-vscode, publish-openvsx]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Write Telegram message
        env:
          MSG: ${{ needs.build.outputs.telegram_msg }}
        run: printf '%s\n' "$MSG" > telegram_message.txt

      - name: Send Telegram Notification
        continue-on-error: true
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message_file: telegram_message.txt

      - name: Notify on Security Release
        if: contains(needs.build.outputs.notes, 'important security updates')
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_NOTES: ${{ needs.build.outputs.notes }}
        with:
          script: |
            const version = process.env.VERSION;
            const releaseNotes = process.env.RELEASE_NOTES;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Security Release v${version} Published`,
              body: [
                `A new security patch release v${version} has been published.`,
                '',
                'Release Notes:',
                releaseNotes,
                '',
                'The extension has been automatically updated in the Visual Studio Marketplace.'
              ].join('\n'),
              labels: ['security']
            });
